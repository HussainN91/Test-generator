# Runs the Test Generator Django app in its own container on the shared VPS,
# attached to UZTGBOT's existing Docker network so its Caddy instance can
# reverse-proxy to it. UZTGBOT's own compose stack is untouched by this file —
# the only shared-infra change is one additive site block in its Caddyfile.
#
# Service is named "testgen", not "web": UZTGBOT's own compose project also
# has a service called "web" on this same external network, and Compose
# registers a network alias per service name. Two containers both claiming
# the "web" alias on a shared network makes Docker's embedded DNS round-robin
# between them — UZTGBOT's Caddyfile already does `reverse_proxy web:8080`,
# so that collision would have intermittently misrouted the live bot's
# traffic into this container. "testgen" avoids it entirely.
services:
  testgen:
    build: .
    restart: unless-stopped
    # Bounded on purpose — same reasoning as UZTGBOT's compose file: the
    # default json-file driver grows without limit.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file: [.env]
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    # Not published. Only Caddy reaches it, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8000),2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - uztgbot_default

networks:
  uztgbot_default:
    external: true
