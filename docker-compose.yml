# Runs the Test Generator Django app and the Caddy reverse proxy that fronts
# it, as one self-contained stack. Nothing outside this file is required:
# the network is this project's own default network, and Caddy's config lives
# in deploy/Caddyfile alongside it.
#
# This stack previously attached to UZTGBOT's external network and borrowed
# that project's Caddy. UZTGBOT has been retired, so both are now owned here.
services:
  testgen:
    build: .
    restart: unless-stopped
    # Bounded on purpose — the default json-file driver grows without limit.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file: [.env]
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    # Not published. Only Caddy reaches it, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8000),2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Reads TESTGEN_DOMAIN, which deploy/Caddyfile substitutes as the site
    # address. Same .env the app uses, so the hostname is declared once.
    env_file: [.env]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - testgen

volumes:
  # Holds the Let's Encrypt account and issued certificates. Named, not a bind
  # mount, and never delete it casually: losing it forces reissue, and LE rate
  # limits duplicate certificates to 5 per week.
  caddy_data:
  caddy_config:
